<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation — Smart Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <style>
        body { background: #f0f2f5; font-family: Arial, sans-serif; margin: 0; }
        .page-content { padding: 20px; margin-top: 80px; max-width: 1000px; margin-left: auto; margin-right: auto; }
        h2.section-heading { font-size: 22px; color: #333; margin: 24px 0 12px; }
        .rules-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 28px; }
        .rules-table th { background: #1976d2; color: white; padding: 12px 16px; text-align: left; font-size: 14px; }
        .rules-table td { padding: 11px 16px; font-size: 14px; color: #444; border-bottom: 1px solid #f0f0f0; }
        .rules-table tr:last-child td { border-bottom: none; }
        .rules-table tr:hover td { background: #f5f9ff; }
        .badge-loc { background: #e8f5e9; color: #388e3c; padding: 2px 9px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .badge-sensor { background: #fff3e0; color: #e65100; padding: 2px 9px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .badge-time { background: #e3f2fd; color: #1565c0; padding: 2px 9px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .badge-days { background: #f3e5f5; color: #7b1fa2; padding: 2px 9px; border-radius: 8px; font-size: 12px; }
        .action-text { color: #333; }
        .dashboard-header nav a.active { color: #fff; background: rgba(255,255,255,0.3); border-radius: 6px; padding: 4px 10px; }
    </style>
</head>
<body>
    <div id="connection-status" class="connected">🟢 Connected</div>
    <div id="last-updated-container">
        <span>Last updated: </span><span id="last-updated">--:--:--</span>
    </div>

    <header class="dashboard-header">
        <h1>🏠 Smart Home Dashboard</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/devices">Devices</a>
            <a href="/automation" class="active">Automation</a>
            <a href="/settings">Settings</a>
        </nav>
    </header>

    <div class="page-content">
        <h2 class="section-heading">⚡ Sensor Rules</h2>
        <table class="rules-table">
            <thead>
                <tr><th>Khu vực</th><th>Sensor</th><th>Điều kiện</th><th>Hành động</th></tr>
            </thead>
            <tbody id="sensor-rules-body">
                <tr><td colspan="4" style="color:#aaa;text-align:center">Loading...</td></tr>
            </tbody>
        </table>

        <h2 class="section-heading">🕐 Time Rules</h2>
        <table class="rules-table">
            <thead>
                <tr><th>Thời gian</th><th>Ngày</th><th>Hành động</th></tr>
            </thead>
            <tbody id="time-rules-body">
                <tr><td colspan="3" style="color:#aaa;text-align:center">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    <script>
        async function loadRules() {
            try {
                const res = await fetch('/api/rules');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                const sensorBody = document.getElementById('sensor-rules-body');
                sensorBody.innerHTML = data.sensor_rules.map(r => `
                    <tr>
                        <td><span class="badge-loc">${r.location}</span></td>
                        <td><span class="badge-sensor">${r.sensor}</span></td>
                        <td>${r.condition}</td>
                        <td class="action-text">→ ${r.action}</td>
                    </tr>`).join('');

                const timeBody = document.getElementById('time-rules-body');
                timeBody.innerHTML = data.time_rules.map(r => `
                    <tr>
                        <td><span class="badge-time">🕐 ${r.time}</span></td>
                        <td><span class="badge-days">${r.days}</span></td>
                        <td class="action-text">→ ${r.action}</td>
                    </tr>`).join('');
            } catch (err) {
                const msg = `<tr><td colspan="4" style="color:red;text-align:center">Lỗi tải rules: ${err.message} — Backend có đang chạy không?</td></tr>`;
                document.getElementById('sensor-rules-body').innerHTML = msg;
                document.getElementById('time-rules-body').innerHTML = msg.replace('colspan="4"', 'colspan="3"');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadRules();
            const poller = new DashboardPoller(2000);
            window.poller = poller;
            poller.updateUI = function(locations) {
                poller.updateTimestamp();
                poller.updateConnectionStatus(true);
            };
            poller.start();
        });
    </script>
</body>
</html>
